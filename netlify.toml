# Netlify build settings (Netlify detects Next.js and adds its Next.js runtime automatically)
[build]
  command = "npm run build"
  publish = ".next"
  # skip every Netlify build: the site is deployed on Vercel only (delete this line to turn Netlify back on)
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"
